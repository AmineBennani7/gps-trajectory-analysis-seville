[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gps-seville"
version = "0.2.0"
description = "GPS trajectory cleaning, analysis and spatial analysis for synthetic vehicle data in Seville"
readme = "README.md"
license = "MIT"
authors = [{ name = "Amine Bennani" }]
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "movingpandas>=0.20",
    "scikit-learn>=1.4",
    "gpxpy>=1.6",
    "folium>=0.17",
    "streamlit>=1.40",
    "streamlit-folium>=0.22",
    "altair>=5",
]

[project.optional-dependencies]
postgis = ["sqlalchemy>=2.0", "geoalchemy2>=0.15", "psycopg[binary]>=3.1"]
osm = ["osmnx>=2.0"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.setuptools]
packages = ["gps_seville"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["screenshots", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # en dashes and accented place names are intended

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "postgis: needs a running PostGIS database (set DATABASE_URL)",
    "network: needs internet access (OpenStreetMap / Overpass)",
]
filterwarnings = [
    "ignore::DeprecationWarning:movingpandas.*",
    "ignore:Setting a value on a DataFrame via .at:Warning",
    "ignore:Missing optional dependencies:UserWarning",
]
